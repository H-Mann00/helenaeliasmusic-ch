# Homepage
hero_subtitle: Dein Duo für jeden Anlass
about_text: Helena & Elias schaffen intime Musikmomente über Jazz, Pop, Blues und Klassiker. Mit über drei Jahren gemeinsamen Spielens bringen wir elegante akustische Klänge und herzliche Gesangsstimmen zu jedem Anlass – ob privates Abendessen, eine spezielle Feier oder ein ruhiger Abend. Wir singen auf Portugiesisch, Englisch und Deutsch und können so mit verschiedenen Publikumsgruppen verbinden. Unser Anliegen ist es, eine Atmosphäre zu schaffen, in der man sich wohl fühlt und persönlich wirkt.
