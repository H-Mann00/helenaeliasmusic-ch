# Introduction
intro_label: Wer wir sind
intro_title: Eine Stimme, eine Gitarre
intro_text: "Eine Stimme, eine Gitarre – und was auch immer der Anlass braucht. Helena & Elias verbinden Jazz, Bossa Nova, Pop, Blues und zeitlose Klassiker zu einem Klang, der von Anfang an intim ist – gemacht, um einen Raum zu füllen, ohne ihn zu überwältigen."
intro_image_alt: "Helena und Elias treten gemeinsam auf, Helena singt und Elias spielt Gitarre"

