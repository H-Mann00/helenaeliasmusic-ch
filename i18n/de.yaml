events_label: Anlässe
events_title: Für jeden Anlass
events_intro: "Von einem ruhigen Abendessen für zwölf bis zur Hochzeit für zweihundert – wir passen unser Set dem Raum an."
events_image_alt: "Helena singt in ein Mikrofon bei einem Open-Air-Anlass"
event_wedding_title: Hochzeiten
event_wedding_desc: "Zeremonie, Apéro oder Feier – akustische Sets im Rhythmus deines Tages."
event_private_title: Private Feiern
