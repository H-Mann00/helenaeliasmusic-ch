# About
about_label: Über uns
about_title: Wir zwei
about_text: "Helena & Elias spielen seit über drei Jahren zusammen und bringen eleganten akustischen Klang und herzlichen Gesang zu Hochzeiten, privaten Feiern, Dinners und Firmenanlässen gleichermassen. Helena singt auf Portugiesisch, Englisch und Deutsch; Elias' Gitarrenspiel bewegt sich mühelos zwischen Jazz, Bossa Nova, Blues, Pop und Klassikern. Wie auch immer der Raum gestaltet ist – unser Ziel bleibt dasselbe: eine Atmosphäre zu schaffen, in der sich jeder Gast persönlich willkommen fühlt."
about_image_alt: "Helena und Elias treten gemeinsam in einem Innenraum auf"

