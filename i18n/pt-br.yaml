# About
about_label: Sobre
about_title: Nós dois
about_text: "Helena & Elias tocam juntos há mais de três anos, trazendo som acústico elegante e vocais sinceros para casamentos, celebrações privadas, jantares e eventos corporativos. Helena canta em português, inglês e alemão; o violão de Elias transita com naturalidade entre jazz, bossa nova, blues, pop e clássicos. Seja qual for o ambiente, nosso objetivo permanece o mesmo: criar uma atmosfera em que cada convidado se sinta pessoalmente bem-vindo."
about_image_alt: "Helena e Elias se apresentando juntos em um ambiente interno"

