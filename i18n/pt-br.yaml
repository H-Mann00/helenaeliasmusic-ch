# Homepage
hero_subtitle: Seu Duo para Cada Ocasião
about_text: Helena & Elias criam momentos musicais íntimos através de jazz, pop, blues e clássicos. Com mais de três anos tocando juntos, trazemos sons acústicos elegantes e vocais sinceros para cada ocasião – seja um jantar privado, uma celebração especial ou uma noite tranquila. Cantamos em português, inglês e alemão, permitindo-nos conectar com públicos diversos. Nosso objetivo é criar uma atmosfera onde todos se sintam à vontade e pessoalmente bem-vindos.
