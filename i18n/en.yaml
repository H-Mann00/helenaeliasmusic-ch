# Homepage
hero_subtitle: Your Duo for Every Occasion
about_text: Helena & Elias create intimate musical moments across jazz, pop, blues, and classic standards. With over three years playing together, we bring elegant acoustic sounds and heartfelt vocals to every occasion – whether it's a private dinner, a special celebration, or a quiet evening. We sing in Portuguese, English, and German, allowing us to connect with diverse audiences. Our aim is to create an atmosphere where everyone feels comfortable and personally welcomed.
