# About
about_label: About
about_title: The two of us
about_text: "Helena & Elias have been playing together for more than three years, bringing elegant acoustic sound and heartfelt vocals to weddings, private celebrations, dinners and corporate events alike. Helena sings in Portuguese, English and German; Elias's guitar moves fluidly between jazz, bossa nova, blues, pop and classic standards. However the room is arranged, our aim stays the same: create an atmosphere where every guest feels personally welcomed."
about_image_alt: "Helena and Elias performing together indoors"

