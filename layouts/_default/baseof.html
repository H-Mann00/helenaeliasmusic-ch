<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ .Title }} | Helena Elias Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="topbar"></div>

<!-- Navigation -->
<nav>
  <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div class="nav-menu" id="navMenu">
    <a href="{{ relLangURL "/" }}" {{ if eq .Type "" }}class="active"{{ end }}>{{ i18n "nav_home" }}</a>
    <a href="{{ relLangURL "/videos/" }}" {{ if eq .Section "videos" }}class="active"{{ end }}>{{ i18n "nav_videos" }}</a>
    <a href="{{ relLangURL "/gallery/" }}" {{ if eq .Section "gallery" }}class="active"{{ end }}>{{ i18n "nav_gallery" }}</a>
    <a href="{{ relLangURL "/setlist/" }}" {{ if eq .Section "setlist" }}class="active"{{ end }}>{{ i18n "nav_setlist" }}</a>
    <a href="{{ relLangURL "/upcoming-events/" }}" {{ if eq .Section "upcoming-events" }}class="active"{{ end }}>{{ i18n "nav_upcoming_events" }}</a>
    <a href="{{ relLangURL "/booking/" }}" {{ if eq .Section "booking" }}class="active"{{ end }}>{{ i18n "nav_booking" }}</a>
  </div>

  <div class="nav-lang">
    {{ range .Translations }}
      <a href="{{ .Permalink }}" class="lang-link{{ if eq .Language.Lang $.Site.Language.Lang }} active{{ end }}">{{ .Language.LanguageName }}</a>
    {{ end }}
  </div>
</nav>

<script>
  const navToggle = document.getElementById('navToggle');
  const navMenu = document.getElementById('navMenu');

  navToggle.addEventListener('click', () => {
    navMenu.classList.toggle('active');
    navToggle.classList.toggle('active');
  });

  document.querySelectorAll('.nav-menu a').forEach(link => {
    link.addEventListener('click', () => {
      navMenu.classList.remove('active');
      navToggle.classList.remove('active');
    });
  });
</script>

{{ block "main" . }}{{ end }}

<!-- Footer -->
<footer>
  <span class="footer-name">Helena &amp; Elias</span>
  <span class="footer-domain">{{ i18n "footer_domain" }}</span>
</footer>
<div class="bottombar"></div>

</body>
</html>
